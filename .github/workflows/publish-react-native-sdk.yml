name: Publish React Native SDK

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @chatropic/react-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set package version from release tag
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME##*/}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME did not include a version"
            exit 1
          fi
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Resolve npm publish tag
        id: publish-tag
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            PRERELEASE="${PACKAGE_VERSION#*-}"
            CHANNEL="${PRERELEASE%%.*}"
            CHANNEL="${CHANNEL%%-*}"
            echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SDK production endpoint
        env:
          CHATROPIC_SDK_PRODUCTION_AGENT_URL: ${{ secrets.CHATROPIC_SDK_PRODUCTION_AGENT_URL }}
        run: node scripts/write-production-endpoint.js

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Scan package surface
        run: npm run release:scan

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${{ steps.publish-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
